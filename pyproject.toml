[project]
name = "enterprise-knowledge-copilot"
version = "0.1.0"
description = "A secure enterprise GenAI platform for retrieving reliable, source-grounded answers from organisational knowledge."
readme = "README.md"
authors = [
    { name = "Hammed Fatai", email = "hammedfataioluwatobi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.scripts]
enterprise-knowledge-copilot = "enterprise_knowledge_copilot:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
